<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Préférences · Tâches</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <!-- Masqué tant que la session n'est pas vérifiée (voir session.js). -->
    <div class="app" id="appView" hidden>

        <!-- Barre du haut (identique sur toutes les pages connectées) -->
        <header class="topbar">
            <a href="/app/todos.html" class="brand">
                <span class="logo" aria-hidden="true"></span>
                <span>Tâches</span>
            </a>
            <div class="menu" id="userMenu">
                <button type="button" class="avatar-btn" id="menuButton" aria-haspopup="menu" aria-expanded="false" aria-controls="menuPanel">
                    <span class="avatar" id="menuAvatar" aria-hidden="true"></span>
                    <span class="sr-only">Ouvrir le menu du compte</span>
                </button>
                <div class="menu-panel" id="menuPanel" role="menu" hidden>
                    <div class="menu-header">
                        <strong id="menuUsername"></strong>
                        <span id="menuEmail"></span>
                    </div>
                    <a href="/app/todos.html" class="menu-item" role="menuitem">Mes tâches</a>
                    <a href="/app/preferences.html" class="menu-item" role="menuitem">Préférences</a>
                    <a href="/app/admin.html" class="menu-item" role="menuitem" id="menuAdmin" hidden>Utilisateurs</a>
                    <div class="menu-sep" role="separator"></div>
                    <button type="button" class="menu-item danger" role="menuitem" id="logoutBtn">Se déconnecter</button>
                </div>
            </div>
        </header>

        <main class="page">
            <div class="page-head">
                <h1>Préférences</h1>
                <p class="subtitle">Gérez votre profil et votre sécurité.</p>
            </div>

            <section class="panel">
                <div class="panel-intro">
                    <h2>Profil</h2>
                    <p>Membre depuis le <span id="profileCreated"></span> · <span id="profileRole"></span></p>
                </div>
                <form id="profileForm" class="panel-body" novalidate>
                    <label class="field">
                        <span>Nom d'utilisateur</span>
                        <input type="text" id="profileUsername" autocomplete="username" required>
                    </label>
                    <label class="field">
                        <span>Email</span>
                        <input type="email" id="profileEmail" autocomplete="email" required>
                    </label>
                    <div class="panel-actions">
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                    </div>
                </form>
            </section>

            <section class="panel">
                <div class="panel-intro">
                    <h2>Mot de passe</h2>
                    <p>8 caractères minimum, avec une minuscule, une majuscule et un chiffre.</p>
                </div>
                <form id="passwordForm" class="panel-body" novalidate>
                    <label class="field">
                        <span>Mot de passe actuel</span>
                        <input type="password" id="currentPassword" autocomplete="current-password" required>
                    </label>
                    <label class="field">
                        <span>Nouveau mot de passe</span>
                        <input type="password" id="newPassword" autocomplete="new-password" required>
                    </label>
                    <label class="field">
                        <span>Confirmation</span>
                        <input type="password" id="confirmPassword" autocomplete="new-password" required>
                    </label>
                    <div class="panel-actions">
                        <button type="submit" class="btn btn-primary">Changer le mot de passe</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script type="module" src="/app/preferences.js"></script>
</body>
</html>
